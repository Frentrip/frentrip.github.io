# Fails if privacy/index.html no longer matches its source,
# docs/legal/privacy-policy.md in Frentrip/frentrip3 (main).
#
# frentrip3 is private, so the job reads it over SSH with a read-only deploy
# key. One-time setup (README.md, "Drift check"):
#   1. ssh-keygen -t ed25519 -N '' -C privacy-drift -f privacy-drift
#   2. frentrip3 → Settings → Deploy keys → Add: privacy-drift.pub, write access OFF
#   3. this repo → Settings → Secrets and variables → Actions → New repository
#      secret: FRENTRIP3_DEPLOY_KEY = contents of privacy-drift (the private key)
#   4. delete both local files
# Without the secret the job fails and says so, rather than passing unchecked.
#
# The source can change without a commit here, so the check also runs daily.

name: Privacy page drift

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      frentrip3_ref:
        description: frentrip3 branch, tag or SHA to compare against
        default: main

permissions:
  contents: read

concurrency:
  group: privacy-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Require the frentrip3 deploy key
        env:
          KEY: ${{ secrets.FRENTRIP3_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret FRENTRIP3_DEPLOY_KEY is not set (or this is a fork's PR, which gets no secrets). See the header of .github/workflows/privacy-drift.yml."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Frentrip/frentrip3
          ref: ${{ inputs.frentrip3_ref || 'main' }}
          ssh-key: ${{ secrets.FRENTRIP3_DEPLOY_KEY }}
          persist-credentials: false
          path: frentrip3
          sparse-checkout: docs/legal/privacy-policy.md
          sparse-checkout-cone-mode: false

      # The release the page was made with, from pandoc's own release and
      # checksum-pinned, so a runner image update cannot change the output.
      - name: Install pandoc 3.1.3
        run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          echo 'caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc  pandoc.deb' | sha256sum -c -
          sudo dpkg -i pandoc.deb
          rm pandoc.deb

      - name: Compare
        run: scripts/privacy-page.sh check frentrip3/docs/legal/privacy-policy.md
