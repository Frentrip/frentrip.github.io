<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frentrip</title>
<meta name="description" content="Plan trips with your friends. Plan. Collaborate. Explore.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Frentrip">
<meta property="og:title" content="Frentrip">
<meta property="og:description" content="Plan. Collaborate. Explore.">
<meta property="og:url" content="https://frentrip.com/">
<meta property="og:image" content="https://frentrip.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!--
  Looks like the app's sign-in screen: the world map (packages/ui/assets/world-map.png,
  under a 30% black scrim like MapBackdrop), a card in the Clean theme's
  surface colour, and the banner (apps/mobile/assets/icon-source/banner/).
  Copy a new version of those files here when they change in frentrip3.
-->
<style>
:root{color-scheme:light dark;--surface:#fff;--text:#202124;--muted:#5f6368;--border:#dadce0;--brand:#1967d2}
@media (prefers-color-scheme:dark){:root{--surface:#292a2d;--text:#e8eaed;--muted:#9aa0a6;--border:#3c4043;--brand:#8ab4f8}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:#123e41 url(assets/world-map.png) center/cover no-repeat}
body::before{content:"";position:fixed;inset:0;background:rgb(0 0 0/.3);pointer-events:none}
main{position:relative;width:100%;max-width:24rem;background:var(--surface);border:1px solid var(--border);
  border-radius:.5rem;padding:2rem 1.5rem;box-shadow:0 8px 24px rgb(0 0 0/.25);text-align:center}
.banner{display:block;width:100%;max-width:15rem;height:auto;margin:0 auto}
.tagline{margin:.75rem 0 0;color:var(--muted);font-size:.875rem}
.soon{margin:1.5rem 0 0}
.open{display:inline-block;margin-top:1rem;padding:.625rem 1.25rem;border-radius:999px;border:1px solid var(--border);
  color:var(--text);text-decoration:none;font-weight:600}
.open:hover,.open:focus-visible{background:rgb(128 128 128/.12)}
nav{margin-top:1.5rem;font-size:.8125rem;color:var(--muted)}
a{color:var(--brand)}
</style>
</head>
<body>
<main>
  <picture>
    <source srcset="assets/banner-dark.png" media="(prefers-color-scheme: dark)">
    <img class="banner" src="assets/banner-light.png" width="1200" height="315" alt="Frentrip">
  </picture>
  <p class="tagline">Plan trips with your friends.</p>
  <p class="soon">Coming soon to iPhone and Android.</p>
  <!--
    A path the installed app claims (frentrip3 apps/mobile/app.json and
    public/.well-known), so a tap opens the app on a phone that has it and the
    web app otherwise. Store build 1.3.8 claims frentrip.expo.app only; switch
    to https://app.frentrip.com/trips/ once most people have 1.3.9, which also
    claims app.frentrip.com (frentrip3 docs/release-checklist.md, step 10.6).
  -->
  <a class="open" href="https://frentrip.expo.app/trips/">Already invited? Open Frentrip</a>
  <nav><a href="privacy/">Privacy policy</a> · <a href="terms/">Terms of Use</a> · <a href="delete-account/">Delete your account</a></nav>
</main>
</body>
</html>
